<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0325 Perfume</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #333;
    }
    header {
      background: #111;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    .hero {
      padding: 80px 20px;
      text-align: center;
      background: #e7e7e7;
    }
    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 18px;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>0325 Perfume</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>Luxury Scents,<i>MADE IN 9JA</i></h1>
    <p>Discover blends crafted to feel timeless and personal.</p>
  </section>

  <section class="products" id="products">
    <div class="card">
      <img src="https://via.placeholder.com/250" alt="Perfume 1" />
      <h3>Floral Breeze</h3>
      <p>Soft, clean, and fresh.</p>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/250" alt="Perfume 2" />
      <h3>Midnight Amber</h3>
      <p>Warm, deep, and bold.</p>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/250" alt="Perfume 3" />
      <h3>Citrus Mist</h3>
      <p>Bright, crisp, and energetic.</p>
    </div>
  </section>

  <footer>
    © 2025 0325 Perfume — All rights reserved.
  </footer>
</body>
</html>
